[project]
name = "taskflow-api"
version = "0.1.0"
description = "Task management REST API — FastAPI + PostgreSQL + JWT auth"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg2-binary>=2.9",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-jose[cryptography]>=3.3",
    # NOTE: passlib 1.7.4 breaks with bcrypt>=4.1 ("password cannot be longer
    # than 72 bytes" / missing __about__). Pinning bcrypt keeps hashing working.
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==4.0.1",
    "python-multipart>=0.0.9",  # required for OAuth2PasswordRequestForm (login form)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",  # FastAPI TestClient runs on top of httpx
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
